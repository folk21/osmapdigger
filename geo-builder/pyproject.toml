[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "osmapdigger-geo-builder"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "pyrosm==0.13.1",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
osmapdigger-geo = "osmapdigger_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
